name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build flow-spi + flow-core
        run: ./gradlew :flow-spi:jar :flow-core:test --info

      - name: Test flow-codegen
        working-directory: flow-codegen
        run: chmod +x ../gradlew && ../gradlew test --info

      - name: Verify flow-spi has zero external deps
        run: |
          # flow-spi must remain JDK-only.
          # `gradle dependencies` prints "No dependencies" for empty configurations.
          if ! ./gradlew :flow-spi:dependencies --configuration runtimeClasspath | grep -q "No dependencies"; then
            echo "ERROR: flow-spi runtime classpath is no longer empty — must stay JDK-only"
            ./gradlew :flow-spi:dependencies --configuration runtimeClasspath
            exit 1
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            flow-core/build/reports/tests
            flow-codegen/build/reports/tests
