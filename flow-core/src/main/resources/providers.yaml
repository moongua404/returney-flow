# LLM 프로바이더 카탈로그.
# InternalLlmRouter가 로드. 모델명 prefix로 프로바이더를 라우팅한다.
#
# 소비자가 자체 providers.yaml로 오버라이드하려면 클래스패스에 같은 경로로 두면 됨.

providers:
  gemini:
    type: gemini
    baseUrl: https://generativelanguage.googleapis.com/v1beta/models
    apiKeyName: gemini
  anthropic:
    type: anthropic
    baseUrl: https://api.anthropic.com
    apiKeyName: anthropic
  openai:
    type: openai
    baseUrl: https://api.openai.com
    apiKeyName: openai
  openai-reasoning:
    type: openai-reasoning
    baseUrl: https://api.openai.com
    apiKeyName: openai

# 모델명 prefix → 프로바이더 라우팅. 첫 매치 승리.
# 더 긴 prefix가 위로 오도록 정렬해야 함 (gpt-5 > gpt-).
routing:
  - prefix: "gemini-"
    provider: gemini
  - prefix: "claude-"
    provider: anthropic
  - prefix: "gpt-5"
    provider: openai-reasoning
  - prefix: "o3-"
    provider: openai-reasoning
  - prefix: "o4-"
    provider: openai-reasoning
  - prefix: "gpt-"
    provider: openai

default: gemini-2.5-flash

# 모델별 capability. supportsThinking이 false면 thinking budget이 0으로 강제됨.
# 누락된 모델은 supportsThinking=false 기본값.
capabilities:
  gemini-2.5-flash:
    supportsThinking: true
    thinkingMaxBudget: 65536
  gemini-2.5-flash-lite:
    supportsThinking: false
  gemini-2.5-pro:
    supportsThinking: true
    thinkingMaxBudget: 65536
  gemini-2.0-flash:
    supportsThinking: true
    thinkingMaxBudget: 65536
  gemini-2.0-flash-lite:
    supportsThinking: false
  claude-sonnet-4-6:
    supportsThinking: true
    thinkingMaxBudget: 32000
  claude-haiku-4-5:
    supportsThinking: true
    thinkingMaxBudget: 10000
  gpt-4.1-mini:
    supportsThinking: false
  gpt-5-mini:
    supportsThinking: false
  gpt-4.1:
    supportsThinking: false

# 모델 fallback 체인. exact key 우선, 없으면 prefix 매칭, 없으면 'default' 키 사용.
# fallback이 또 실패하면 끝까지 따라가지 않고 거기서 멈춤 (1단 fallback).
fallback:
  claude-sonnet-4-6: claude-haiku-4-5
  gpt-5-mini: gpt-4.1-mini
  default: gemini-2.5-flash-lite
