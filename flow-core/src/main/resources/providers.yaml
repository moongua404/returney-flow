# LLM 프로바이더 카탈로그.
# InternalLlmRouter가 로드. 모델명 prefix로 프로바이더를 라우팅한다.
#
# 소비자가 자체 providers.yaml로 오버라이드하려면 클래스패스에 같은 경로로 두면 됨.

providers:
  gemini:
    type: gemini
    baseUrl: https://generativelanguage.googleapis.com/v1beta/models
    apiKeyName: gemini
  anthropic:
    type: anthropic
    baseUrl: https://api.anthropic.com
    apiKeyName: anthropic
  openai:
    type: openai
    baseUrl: https://api.openai.com
    apiKeyName: openai
  openai-reasoning:
    type: openai-reasoning
    baseUrl: https://api.openai.com
    apiKeyName: openai

# 모델명 prefix → 프로바이더 라우팅. 첫 매치 승리.
# 더 긴 prefix가 위로 오도록 정렬해야 함 (gpt-5 > gpt-).
routing:
  - prefix: "gemini-"
    provider: gemini
  - prefix: "claude-"
    provider: anthropic
  - prefix: "gpt-5"
    provider: openai-reasoning
  - prefix: "o3-"
    provider: openai-reasoning
  - prefix: "o4-"
    provider: openai-reasoning
  - prefix: "gpt-"
    provider: openai

default: gemini-2.5-flash

# 모델별 attribute. 라우팅과 별개로, 모델 단위 quota/capability를 모은다.
# - supportsThinking: false면 thinkingBudget이 0으로 강제됨
# - thinkingMaxBudget: 양수면 budget이 이 값으로 cap
# - rate: 60초 슬라이딩 윈도우 한도. 미명시면 무제한 (1회 stderr 경고)
models:
  gemini-2.5-flash:
    supportsThinking: true
    thinkingMaxBudget: 65536
    rate: { rpm: 2000, tpm: 4000000 }
  gemini-2.5-flash-lite:
    supportsThinking: false
    rate: { rpm: 4000, tpm: 4000000 }
  gemini-2.5-pro:
    supportsThinking: true
    thinkingMaxBudget: 65536
    rate: { rpm: 1000, tpm: 4000000 }
  gemini-2.0-flash:
    supportsThinking: true
    thinkingMaxBudget: 65536
    rate: { rpm: 2000, tpm: 4000000 }
  gemini-2.0-flash-lite:
    supportsThinking: false
    rate: { rpm: 4000, tpm: 4000000 }
  claude-sonnet-4-6:
    supportsThinking: true
    thinkingMaxBudget: 32000
    rate: { rpm: 50, tpm: 80000 }
  claude-haiku-4-5:
    supportsThinking: true
    thinkingMaxBudget: 10000
    rate: { rpm: 100, tpm: 200000 }
  gpt-4.1-mini:
    supportsThinking: false
    rate: { rpm: 500, tpm: 2000000 }
  gpt-5-mini:
    supportsThinking: false
    rate: { rpm: 500, tpm: 2000000 }
  gpt-4.1:
    supportsThinking: false
    rate: { rpm: 500, tpm: 800000 }

# 모델 fallback 체인. exact key 우선, 없으면 prefix 매칭, 없으면 'default' 키 사용.
# fallback은 transient 오류로 같은 모델 retry가 모두 소진된 후에만 트리거된다.
fallback:
  claude-sonnet-4-6: claude-haiku-4-5
  gpt-5-mini: gpt-4.1-mini
  default: gemini-2.5-flash-lite

# Transient 오류 (LlmTransientException, LlmNetworkException) 재시도 정책.
# permanent 오류 (LlmClientErrorException 등 4xx)는 재시도/fallback 모두 안 함.
# 백오프: min(maxDelayMs, initialDelayMs * backoffMultiplier^i) * (1 ± jitter)
# 미명시 시 RetryPolicy.DEFAULT 사용 (3, 500, 10000, 2.0, 0.2).
retry:
  maxAttempts: 3
  initialDelayMs: 500
  maxDelayMs: 10000
  backoffMultiplier: 2.0
  jitter: 0.2
